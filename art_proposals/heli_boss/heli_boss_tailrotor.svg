<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
<!-- ══════════════════════════════════════════════════════════════════
  BOSS·大型武装直升机 尾桨件（提案）。盘面平行屏幕（物理成立：尾桨盘
  本就平行侧视平面）→ 引擎侧整周旋转 14rad/s（BOSS_ROTOR_SPIN）。

  ── 拆件规约 ── 画布中心 (36,36) = 旋转轴（毂心）；最大回转半径 31，
  画布 72×72（半径 36 ≥ 31 ✓ 方形整周转件规约）。

  ── 比例账 ── 尾桨直径 62 = 0.18×机身全长 340（真实 Mi-24 3.0/17.5
  ≈0.17 ✓）；3 叶（自根部 r8 至叶尖 r31），叶宽根 9→尖 7（r2 由 7/5 加）；
  叶尖红帽=旋转时读出红色扫掠圈。

  ── 坐标账 ── 叶0 = +x 水平叶 (44,31.5)(67,32.5)(67,39.5)(44,40.5)，
  叶1/叶2 = 叶0 各绕毂心 (36,36) 旋 120°/240°（逐点算账见下）：
   (44,31.5)→(36.0,45.0)/(28.0,31.5)   (67,32.5)→(23.5,64.5)/(17.5,11.0)
   (67,39.5)→(17.5,61.0)/(23.5,7.5)    (44,40.5)→(28.0,40.5)/(36.0,27.0)
  叶尖帽 = 各叶外侧 8px 截段。

  ── 锚点账 ── 引擎侧本件挂 body (326,66)，层级在 body 之上（近侧盘，
  垂尾只被桨叶扫过）；pivot = 本画布 (36,36)。

  ── 修正账 ── r2：叶宽 7/5→9/7、毂 r7→8（小件在 2400 宽视口里加码）
══════════════════════════════════════════════════════════════════ -->
<!-- 叶1（120°） -->
<polygon points="36,45 23.5,64.5 17.5,61 28,40.5" fill="#332e2c"/>
<polygon points="25,58 23.5,64.5 17.5,61 19,55" fill="#ff5140" opacity="0.85"/>
<!-- 叶2（240°） -->
<polygon points="28,31.5 17.5,11 23.5,7.5 36,27" fill="#332e2c"/>
<polygon points="25,14 23.5,7.5 17.5,11 19,17" fill="#ff5140" opacity="0.85"/>
<!-- 叶0（水平） -->
<polygon points="44,31.5 67,32.5 67,39.5 44,40.5" fill="#332e2c"/>
<polygon points="59,32 67,32.5 67,39.5 59,40" fill="#ff5140" opacity="0.85"/>
<!-- 毂 -->
<circle cx="36" cy="36" r="8" fill="#282322"/>
<circle cx="36" cy="36" r="3" fill="#171514"/>
</svg>
