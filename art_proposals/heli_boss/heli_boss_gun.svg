<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104">
<!-- ══════════════════════════════════════════════════════════════════
  BOSS·大型武装直升机 下巴机炮塔件（提案）。ArmPivot 瞄准件：随玩家
  俯仰（直射"枪口朝人"本身就是预警）；高扫三态引擎摆平（rotation=0）。

  ── 拆件规约 ── 画布中心 (52,52) = 回转轴（枢轴销心）；炮口距 pivot
  最远 √(44²+23.5²)=49.9 ≤ 画布半边 52 ✓。

  ── 比例账（功能反推，skill 机构链）──
  敌弹水滴宽≈5 读感 → 管宽 7（视觉放大档）→ 双管（二阶段 TWIN_OFFSET
  双枪口即两管实际出口）中心距 14（y28.5/y42.5）→ 管长 36（枪管长径比档）
  → 塔体 28×24（装下炮尾 + 俯仰枢轴）→ 枢轴销 12×10 → 供弹槽斜挂塔后。

  ── 锚点账 ── 引擎侧本件挂 body (36,96)（炮塔围领上，body 注释同账）。
  pivot = 本画布 (52,52)。
  双枪口（画布坐标）：Muzzle_A=(8,28.5) Muzzle_B=(8,42.5)
  —— 相对 pivot：(−44,−23.5) / (−44,−9.5)；落 body 坐标 (−8,72.5)/(−8,86.5)
  （伸出鼻尖 8px）。一阶段单枪口取 A；二阶段双机枪两 Marker 各钉一管。

  ── 修正账 ──
  · r1：塔体 #332e2c 与机身同族、双管压暗 #282322（枪=机械暗件）
  · r2：全塔放大 1.4×（r1 在机身里读不到）+ 挂点 (38,89)→(36,96)：
    颊部之下吊挂、双管探出鼻尖——下巴炮塔的正确剪影
══════════════════════════════════════════════════════════════════ -->
<!-- 双管（上管 y25-32 / 下管 y39-46，中心距 14） -->
<rect x="8" y="25" width="36" height="7" fill="#282322"/>
<rect x="8" y="39" width="36" height="7" fill="#282322"/>
<!-- 炮口环（消焰器段） -->
<rect x="8" y="25" width="4" height="7" fill="#171514"/>
<rect x="8" y="39" width="4" height="7" fill="#171514"/>
<!-- 上管顶缘亮条 -->
<rect x="12" y="25" width="26" height="2" fill="#453d39" opacity="0.5"/>
<!-- 塔体 + 枢轴销 + 供弹槽 -->
<polygon points="38,22 62,22 64,46 36,46" fill="#332e2c"/>
<polygon points="44,46 60,46 58,56 46,56" fill="#282322"/>
<polygon points="56,54 66,52 70,60 60,62" fill="#282322"/>
</svg>
