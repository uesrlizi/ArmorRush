<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 56" width="380" height="56">
<!-- ══════════════════════════════════════════════════════════════════
  BOSS·大型武装直升机 主旋翼件（提案）。侧视刃边——引擎侧呼吸摆动
  ±0.035rad（BOSS_ROTOR_WOBBLE），不做整周旋转；画布只画默认水平姿态。

  ── 拆件规约 ── 画布中心 (190,28) = 旋转轴（毂心）。最大回转半径 185
  （右叶全长），画布 380×56 = 半径 190 余量 ≥ 摆动扫掠 ✓。

  ── 比例账 ── 旋翼直径 370 = 1.09×机身长 340（Mi-24 17.3/17.5≈0.99，
  重型上探档）；桨叶宽 14（重型宽弦桨，r2 由 12 加）；5 叶侧视投影：
  方位 0°/72°/144°/216°/288° → 屏幕投影 |cos|：右全长 1 叶（r185）、
  左重叠对 2 叶（r150，上下错 5px 分叶读法）；72°/288° 对（r57）隐入
  右全长叶后方不画。挥舞上反角 2.3°：叶尖抬高 7px。
  叶尖红色桨尖帽（双叶对 0.7 暗档）——挥舞摆动时红尖描出轨迹弧。
  毂 r16 + 顶帽点 r6 + 桅柱根（body 桅柱帽 y6-12 盖其下缘）。

  ── 锚点账 ── 引擎侧本件挂 body (156,5)（heli_boss_body.svg 注释）；
  pivot = 本画布 (190,28)。

  ── 修正账 ──
  · r2：叶弦 12→14、毂 r13→16、左叶对上下错 3→5px（投影分叶更可读）
══════════════════════════════════════════════════════════════════ -->
<!-- 左叶对·下层（方位216°，暗档） -->
<polygon points="176,26 46,18 40,21 40,29 46,32 176,40" fill="#282322"/>
<polygon points="46,18 40,21 40,29 46,32" fill="#ff5140" opacity="0.7"/>
<!-- 左叶对·上层（方位144°） -->
<polygon points="176,21 46,13 40,16 40,24 46,27 176,35" fill="#332e2c"/>
<polygon points="46,13 40,16 40,24 46,27" fill="#ff5140" opacity="0.9"/>
<!-- 右全长叶（方位0°，r185） -->
<polygon points="204,22 369,15 375,18 375,26 369,29 204,36" fill="#332e2c"/>
<polygon points="369,15 375,18 375,26 369,29" fill="#ff5140" opacity="0.9"/>
<!-- 变距拉杆两根 -->
<line x1="183" y1="16" x2="187" y2="26" stroke="#171514" stroke-width="1.5"/>
<line x1="198" y1="16" x2="194" y2="26" stroke="#171514" stroke-width="1.5"/>
<!-- 桨毂 + 顶帽点 + 桅柱根 -->
<circle cx="190" cy="28" r="16" fill="#282322"/>
<circle cx="190" cy="28" r="6" fill="#171514"/>
<rect x="184" y="42" width="12" height="8" fill="#171514"/>
</svg>
