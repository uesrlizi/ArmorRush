<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120">
<!-- ══════════════════════════════════════════════════════════════════
  BOSS·大型武装直升机 body 件（提案）——机身/串列座舱/发动机舱/旋翼塔/短翼/
  翼下导弹巢/收起轮舱整流罩/尾梁/垂尾/平尾。原生朝左（机头 x=0 端）。
  姊妹件：heli_boss_rotor / heli_boss_tailrotor / heli_boss_gun（同目录）。

  ── 视角 ── 纯侧视。全直线多边形拼块（精英/杂兵同语汇），无朝向镜头的
  管口/截面；导弹仓口=巢前端（朝左）平齐深缝，与精英垂发舱同语汇、朝向改前向。

  ── 比例账（真实参照 Mi-24P / AH-64 侧视三面 + 功能反推）──
  · 游戏锚：BOSS 碰撞盒 290×170（boss.tscn 设计给定，盖旋翼扫掠全高）；
    机身画布 340×120。机身全长 340 / 玩家机甲高 104 = 3.27 档（大型机）。
  · 机身深（座舱顶 y16 → 腹部 y88 中段）≈50 = 0.147×全长
    （真实串列座舱重武直 0.13–0.15 ✓）；尾椎收细至深 28（背腹线向尾收敛）
  · 短翼弦长 70 = 0.206×全长（Mi-24 半翼展/全长≈0.18 投影档）；
    导弹巢前端（x118）伸出翼前缘（x120）——Mi-24 挂巢前突读法
  · 导弹巢功能链：飞行弹径 5.6（heavy_missile 占位弹 8×0.7）→ 仓口 6×9
    （≥1.6×弹径，精英同档仓口宽 9）→ 2 仓 + 仓壁 → 巢口带宽 24 → 巢体 54×28
  · 座舱串列阶梯：前座（炮手）顶 y28 / 后座（驾驶员）顶 y16，阶差 12
    （真实串列座舱后高前低 ✓）；红眼缝=前座鼻下传感器（敌方识别，Drone 同位）

  ── 锚点账（引擎侧直接抄画布坐标，不二次换算）──
  · Rotor 建议挂点（主旋翼毂心）= (156,5)；mast 顶帽 (146,6)-(170,12)
  · TailRotor 建议挂点 = (326,66)（垂尾中段，盘面平行屏幕整周旋转；
    挂载层级在 body 之上=近侧盘，整盘可见）
  · Gun（heli_boss_gun，pivot=画布(52,52)）建议挂点 = (36,96)
    （炮塔围领 (26,84)-(50,100) 已画在 body 上）
    双枪口落 body 坐标 (−8,72.5) / (−8,86.5)（伸出鼻尖前方 8px）
  · MissilePorts 仓口（巢前端平齐深缝）：Port_A=(115,102) Port_B=(115,114)
    ——BOSS_RAIN_COUNT=4 走 ports%size 轮转（2 仓口即可，精英同构）；
    建议 ThreatFlash 预警挂 Port 列（"预警在发射器上"）
  · EyeGlow 建议挂点 = (13,68)（红眼缝中心）
  · 碰撞盒 290×170 以画布中心对齐时盖 x[25,315]：机头探针与垂尾后缘
    出盒=薄端不吃弹，可接受（精英头亦在盒内）

  ── 修正账 ──
  · r1：删远侧短翼+远侧导弹巢（被机身完全遮挡不可见，改单巢 2 仓口轮转）
  · r1：红识别条收敛为尾梁 1 道（眼+1 条，restraint）
  · r2：机身去"鲸形"——背腹线向尾部收敛（尾椎深 28）、鼻背斜面加陡
    （(6,62)→(34,44)）；座舱加高（前 28/后 16）；平尾上移出甲板线
    （284,40 一带，读作远侧平尾）
  · r2：机炮塔整体放大并下移（挂点 89→96），双管伸出鼻尖；导弹巢前移
    （126→118）露翼前缘；旋翼叶弦 12→14、毂 r13→16（配合 rotor 件 r2）
  · r3：鼻线收锐（鼻尖 (6,62)→(4,64)，颊部 (12,72)/(30,82)→(10,74)/(28,84)）；
    短翼压暗一档（#332e2c→#282322）+ 根缝——与机身同色糊成一片的修正；
    加舱板缝两道（横 60-190@y64 / 竖 204@x）破中段大平空缺；
    眼缝随鼻线下移 (10,63)→(8,66)
══════════════════════════════════════════════════════════════════ -->
<!-- 炮塔围领（gun 件的安装座，gun 画在其上） -->
<polygon points="26,84 50,88 48,100 28,98" fill="#282322"/>
<!-- 机身主结构：鼻尖收锋（r3 加陡）→ 前甲线 → 尾椎收敛（深 28）→ 腹线 → 颊部收 -->
<polygon points="4,64 36,44 46,40 300,44 334,56 334,72 300,76 170,88 58,88 28,84 10,74" fill="#332e2c"/>
<!-- 舱板缝两道（破中段大平空缺） -->
<rect x="60" y="64" width="130" height="1.5" fill="#282322" opacity="0.6"/>
<rect x="204" y="46" width="1.5" height="40" fill="#282322" opacity="0.6"/>
<!-- 发动机舱：机背驼峰 + 进气斜缘亮条 + 尾向排气槽×2 -->
<polygon points="128,40 140,20 182,16 196,26 200,42" fill="#332e2c"/>
<polygon points="140,20 182,16 183,19 141,23" fill="#453d39" opacity="0.4"/>
<polygon points="182,24 192,22 193,26 183,28" fill="#171514"/>
<polygon points="180,30 190,28 191,32 181,34" fill="#171514"/>
<!-- 舱侧散热栅两道 -->
<rect x="150" y="30" width="16" height="1.5" fill="#282322" opacity="0.8"/>
<rect x="150" y="34" width="16" height="1.5" fill="#282322" opacity="0.8"/>
<!-- 旋翼塔：桅柱 + 顶帽（Rotor 毂心 156,5 落帽上方） -->
<polygon points="146,40 150,8 162,8 166,42" fill="#282322"/>
<rect x="144" y="6" width="24" height="6" fill="#171514"/>
<!-- 串列座舱：前座（炮手，低+前缘后掠）/ 后座（驾驶员，抬升 12） -->
<polygon points="46,42 64,28 88,28 88,42" fill="#171514"/>
<polygon points="90,42 96,16 122,16 126,42" fill="#171514"/>
<polygon points="60,30 66,30 60,38 54,38" fill="#453d39" opacity="0.35"/>
<polygon points="100,18 106,18 102,28 96,28" fill="#453d39" opacity="0.35"/>
<!-- 短翼：弦 70（x120-192），压暗一档与机身分件 + 前缘亮条 + 根缝/后缘暗缝 -->
<polygon points="122,68 172,64 192,70 192,82 134,84 120,76" fill="#282322"/>
<polygon points="124,67 190,65 190,67 124,69" fill="#171514" opacity="0.7"/>
<polygon points="122,68 172,64 173,67 123,71" fill="#453d39" opacity="0.5"/>
<polygon points="134,84 190,82 190,84 134,86" fill="#171514" opacity="0.8"/>
<!-- 翼下导弹巢：挂架 + 巢体（前端平齐深缝双仓口 Port_A/B）+ 仓口缘亮条 -->
<rect x="132" y="82" width="18" height="10" fill="#282322"/>
<polygon points="118,95 168,92 172,116 128,120 118,113" fill="#332e2c"/>
<rect x="118" y="97" width="6" height="9" fill="#171514"/>
<rect x="118" y="109" width="6" height="9" fill="#171514"/>
<rect x="116" y="96" width="2" height="11" fill="#453d39"/>
<rect x="116" y="108" width="2" height="11" fill="#453d39"/>
<!-- 收起轮舱整流罩（悬停收起态）：前柱 / 后柱 -->
<polygon points="56,88 88,88 86,102 60,100" fill="#282322"/>
<polygon points="222,83 262,80 260,94 226,96" fill="#282322"/>
<!-- 垂尾：后掠梯形 + 前缘亮条；尾梁段红识别条（阵营色唯一大道具） -->
<polygon points="302,52 322,14 336,14 340,22 338,66 334,70" fill="#332e2c"/>
<polygon points="302,52 322,14 325,16 306,53" fill="#453d39" opacity="0.4"/>
<rect x="250" y="54" width="16" height="5" fill="#ff5140" opacity="0.85"/>
<!-- 平尾（远侧，越甲板线读出） -->
<polygon points="284,40 318,34 322,40 288,46" fill="#282322"/>
<!-- 垂尾天线 -->
<line x1="330" y1="15" x2="339" y2="0" stroke="#171514" stroke-width="1.5"/>
<!-- 红色传感器眼缝（前座鼻下；EyeGlow 挂 13,68 场景侧加辉光） -->
<rect x="8" y="66" width="10" height="4" fill="#ff5140"/>
</svg>
