       底缘：t4.5 居中、沿 n 半长17、stroke9 圆帽 → 线 (58.2,157.8)-(82.2,181.8)
       弹壳：底 t12 半宽15.5 → t52 直段 → t68 瓶肩收半宽11.5 → t84 口部：
