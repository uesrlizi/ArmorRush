<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- 触控按钮图标·斩击 v2：十字剑侧视剪影，斜 45° 尖朝右上（动作向，与开火/推进同族对角）。
     纯白无色彩族（用户定案 2026-10-21）：单一 #ffffff 平涂，零件间留 2~2.5px 缝隙
     （缝隙透出按钮暗底板=零件分隔，不上第二色）。旧「不画剑」定案被用户推翻。
     画布 240×240，引擎内显示 120×120（2px/单位档，同族）。
     比例账（真实参照：武装剑 arming sword，刃:护手:柄 ≈ 8:2:1；
       图标惯例护手/柄夸大约 2× 保小尺寸可读）：
       全长 192（含柄首），刃长 128、护手通宽 ≈59、柄 28、柄首 r10。
     坐标账（轴向 u=(0.7071,-0.7071) 尾→尖，法线 n=(0.7071,0.7071)，
       P(t) = (120+(t-96)·0.7071, 120-(t-96)·0.7071)，t=0 柄首底 → t=192 剑尖）：
       柄首：圆 r10 @t10 → (59.2,180.8)
       柄：t22..50 宽10 → 四角 (64.2,168.8)/(71.2,175.8)/(91.0,156.0)/(84.0,149.0)
       护手：t55 居中、沿 n 半长27、stroke13 圆帽 → 线 (71.9,129.9)-(110.1,168.1)
         （覆盖 t48.5..61.5，压住柄尾交接处=护手桩读法）
       刃：t64 基宽12 → t172 收 7 → t192 尖：
         (93.2,138.4)→(171.2,63.8)→(187.9,52.1)→(176.2,68.8)→(101.6,146.8) Z
     缝隙账：柄首|柄 t20|22=2px；护手|刃 t61.5|64=2.5px；护手压柄尾（有意相接）。
     包盒 ≈(49..188, 52..191)，视觉居中（左49/右52/上52/下49，PIL 断言实测）。 -->
  <g fill="#ffffff" stroke="none">
    <circle cx="59.2" cy="180.8" r="10"/>
    <path d="M 64.2,168.8 L 71.2,175.8 L 91.0,156.0 L 84.0,149.0 Z"/>
    <path d="M 93.2,138.4 L 171.2,63.8 L 187.9,52.1 L 176.2,68.8 L 101.6,146.8 Z"/>
