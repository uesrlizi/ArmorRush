<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- 触控按钮图标·射击备选：手枪侧视剪影朝右（提案备胎，未接线——用户在
     「枪 or 一颗子弹」间未定，弹壳版为推荐接线稿，本张留评审对比）。
     纯白无色彩族（用户定案 2026-10-21）：单一 #ffffff 平涂。
     画布 240×240，引擎内显示 120×120（2px/单位档，同族）。
     比例账（真实参照半尺寸手枪侧视，icon 惯例扳机护环夸大）：
       套筒长 152、高 26；框体高 16；握把前倾（顶宽 38→底宽 30，后倾 16）；
       护环内径 ~36（指位）。
     坐标账（水平右向，枪口=右）：
       准星：小方 (176,70)-(190,78)
       套筒：圆角矩形 (44,78)-(196,104) r7
       框体：(58,104)-(150,120)
       护环：stroke10 圆帽折线 M(152,120) L(152,142) Q(152,158)(136,158) L(116,158)
       握把：四角 (58,104)/(96,104)/(72,178)/(42,178)
     包盒 ≈(42..196, 70..178)，视觉居中（左42/右44/上50/下62，质心略低=枪的自然站姿）。 -->
  <g fill="#ffffff" stroke="none">
    <rect x="176" y="70" width="14" height="8"/>
    <rect x="44" y="78" width="152" height="26" rx="7"/>
    <rect x="58" y="104" width="92" height="16"/>
    <path d="M 58,104 L 96,104 L 72,178 L 42,178 Z"/>
  </g>
  <path d="M 152,120 L 152,142 Q 152,158 136,158 L 116,158"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
</svg>
