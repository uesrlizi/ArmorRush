</g>
  </g>
  <g transform="translate(-5.75,-24.38) scale(0.5833) translate(-80,-80)">
<!-- 玩家机甲·臂件：肩甲→大臂→小臂→枪 一整件，肩关节=唯一旋转轴（俯仰±60°/朝向镜像由引擎做）。
     用户绘制 v2 拆件（唯一美术定稿 player_mech_user_v2.svg，本件不改色不改形）。
     色阶：受光#3c4148/中值#2e3238/暗板#26292e/最深#1d2024 + 橙#ffa04a；无头无眼（设计如此）。
     矩形+rotate 已烘焙为等价多边形（ThorVG 不支持 rect+rotate，2026-10-16 崩溃规避）。
     画布 160×160，旋转轴=画布中心 (80,80)；最大回转半径(轴→枪口) 74.8 < 80，任意俯仰不出画布。
     出口坐标（精灵缩放 0.5833333）：Muzzle = 轴+(42.06,11.69)，即 ArmPivot 局部同一对数。
     回原 v2 空间偏移 translate(46.4593,67.7980)；
     挂法：ArmPivot.position=((33.54,12.20)-(54,54))*0.5833，Arm 精灵居中置于 ArmPivot 原点。 -->
<g transform="translate(46.4593,67.7980)">
<g transform="translate(2,2) scale(0.3377) translate(-329,-474)">
