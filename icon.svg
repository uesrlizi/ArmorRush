<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Armor Rush 游戏图标 512x512（游戏内 icon.svg 同源）。
     构图（2026-10-17 用户定稿）：机甲全身立姿居中(内容中心 x=256，足踩 y=430 平台缘)，
     远景塔楼剪影+斜雨，暖沙尘天四段平涂(#b3a97f/#c9b88e/#a89a76/#9c8f6e=env_rust_far 天色账)。
     黄弹已按用户要求移除。色全部出自现役素材：机甲4阶灰+琥珀#ffa04a，平台#46433a，地面底#3a382f。
     比例账：机甲高 368px=画布 72%（小尺寸可读底线 60%）；
     机甲挂载账同 player.tscn（喷口/体/臂三件，精灵缩放 0.5833 内置）。
     小尺寸自验：icon_48.png 中央暗部须仍成剪影。 -->
<!-- 天空四段平涂（env_rust_far 渐变色的分档取样） -->
<rect x="0" y="0" width="512" height="165" fill="#b3a97f"/>
<rect x="0" y="165" width="512" height="97" fill="#c9b88e"/>
<rect x="0" y="262" width="512" height="118" fill="#a89a76"/>
<rect x="0" y="380" width="512" height="50" fill="#9c8f6e"/>
<!-- 远景塔楼剪影（env_rust_far 塔 x0.4 透明度档） -->
<polygon points="300,430 300,300 312,270 322,282 332,262 342,276 342,430" fill="#857a5e" opacity="0.4"/>
<polygon points="350,430 350,240 366,228 380,242 394,232 408,248 408,430" fill="#9a9078" opacity="0.5"/>
<polygon points="422,430 422,210 440,198 458,214 474,206 490,222 490,430" fill="#857a5e" opacity="0.5"/>
<line x1="436" y1="198" x2="436" y2="176" stroke="#857a5e" stroke-width="3" opacity="0.5"/>
<!-- 地面：env_rust_deck 平台条 x2 + 底色(env_rust_ground_top 底缘色) -->
<rect x="0" y="456" width="512" height="56" fill="#3a382f"/>
<g transform="translate(0,430)"><defs>

</defs>
<rect x="0" y="0" width="720" height="26" fill="#46433a"/>
<line x1="0" y1="1.5" x2="720" y2="1.5" stroke="#5a574b" stroke-width="2"/>
<line x1="0" y1="24.5" x2="720" y2="24.5" stroke="#37352d" stroke-width="2"/></g>
<g transform="translate(720,430)"><defs>

</defs>
<rect x="0" y="0" width="720" height="26" fill="#46433a"/>
<line x1="0" y1="1.5" x2="720" y2="1.5" stroke="#5a574b" stroke-width="2"/>
<line x1="0" y1="24.5" x2="720" y2="24.5" stroke="#37352d" stroke-width="2"/></g>
<!-- 玩家机甲：三拆件按 player.tscn 挂载账组装（喷口在体后、臂在最前），居中 x=256，足踩平台缘 y=430
     组变换 translate(228.1,249.0) scale(6.20)；足底=AY+29.2*S，枪口=AX+(36.31*S,-12.69*S) -->
<g transform="translate(228.10,249.00) scale(6.2000)">
  <g transform="translate(-15.69,-12.45) scale(0.5833) translate(-16,-16)">
<!-- 玩家机甲·喷口件：喷口锥+根部辉光，可动旋转件（摆幅±20°由 Balance.NOZZLE_SWING_DEG 定）。
     用户绘制 v2 拆件（唯一美术定稿 player_mech_user_v2.svg，本件不改色不改形）。
          色阶：受光#3c4148/中值#2e3238/暗板#26292e/最深#1d2024 + 橙#ffa04a；无头无眼（设计如此）。
     画布 32×32，旋转轴=画布中心 (16,16)=辉光中心 v2(14.83,34.42)（挂载点，转动零漂移）；
     最大回转半径 9.8 < 16，±20° 摆动不出画布。
     焰口轴线（锥顶(16.28,33.34)→焰口中点(7.39,39.01)）= 147.5°；焰原生朝+Y，基础旋转=1.0030 rad。
     焰口中点（枢轴局部）=(-7.44,4.59) 画布 = (-4.34,2.68)px（缩放 0.5833333），推进焰 Thruster 挂此处。
     回原 v2 空间偏移 translate(1.1674,-18.4192)；挂法：NozzlePivot.position=((14.83,34.42)-(54,54))*0.5833，
     随朝向镜像 position.x 与 scale.x，摆动写 NozzlePivot.rotation（镜像由 scale 提供，摆角与朝向无关）。 -->
<g transform="translate(1.1674,-18.4192)">
<g transform="translate(2,2) scale(0.3377) translate(-329,-474)">
<path id="_喷口" data-name="喷口" fill="#26292e" d="M351.24,553.05c-3.87,8.92-7.75,17.84-11.62,26.77,3.57,2.52,7.13,5.04,10.7,7.56,6.99-6.86,13.98-13.71,20.97-20.57-6.68-4.58-13.36-9.17-20.05-13.75Z"/>
  <circle cx="367" cy="570" r="7" fill="#ffa04a" opacity="0.18"/>
  <circle cx="367" cy="570" r="3.5" fill="#ffa04a"/>
</g>
</g>
  </g>
  <g transform="translate(6.18,0) scale(0.5833) translate(-54,-54)">
<!-- 玩家机甲·身体件：腿-远/腿-近/躯干(腰跨胸+胸传感器)/胸-肩；喷口已拆至 player_mech_user_nozzle.svg。
     用户绘制 v2 拆件（唯一美术定稿 player_mech_user_v2.svg，本件不改色不改形）。
     色阶：受光#3c4148/中值#2e3238/暗板#26292e/最深#1d2024 + 橙#ffa04a；无头无眼（设计如此）。
     矩形+rotate 已烘焙为等价多边形（ThorVG 不支持 rect+rotate，2026-10-16 崩溃规避）。
     画布 108×108 原坐标空间，画布中心(54,54)=机体锚点原点（精灵缩放 0.5833333，局内 63px 高）。
     肩关节(臂件旋转轴)在本画布 (33.54,12.20)；喷口枢轴(辉光中心)在本画布 (14.83,34.42)。
     臂件/喷口件见 player_mech_user_arm.svg / player_mech_user_nozzle.svg。 -->
<g transform="translate(2,2) scale(0.3377) translate(-329,-474)">
<g id="_腿-远" data-name="腿-远">
    <path fill="#1d2024" d="M418.75,645.89c3.82,19.37,7.63,38.73,11.45,58.1h0c8.92-2.89,17.84-5.77,26.76-8.66-3.85-19.79-7.7-39.59-11.55-59.38-3.18-1.37-6.36-2.73-9.54-4.1-4.07,1.37-8.15,2.73-12.22,4.1-1.63,3.31-3.27,6.63-4.9,9.94Z"/>
