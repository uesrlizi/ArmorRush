    <path fill="#26292e" d="M445.58,645.89c3.82,19.37,7.63,38.73,11.45,58.1h0c8.92-2.89,17.84-5.77,26.76-8.66-3.85-19.79-7.7-39.59-11.55-59.38-3.18-1.37-6.36-2.73-9.54-4.1-4.07,1.37-8.15,2.73-12.22,4.1-1.63,3.31-3.27,6.63-4.9,9.94Z"/>
    <path fill="#26292e" d="M473.84,755.86c3.16,2.58,6.33,5.16,9.49,7.75,8.28,1.85,16.57,3.71,24.85,5.56-2.67,4.25-5.34,8.5-8.01,12.75h-78.58c-.9-1.85-1.79-3.7-2.69-5.55,2.18-6.57,4.36-13.13,6.54-19.7,16.13-.27,32.27-.54,48.4-.81Z"/>
    <path fill="#2e3238" d="M447.19,693.83c-8.24,22.32-16.47,44.64-24.71,66.96,4.52,3.51,9.04,7.01,13.57,10.52h37.16c8.65-28.93,17.31-57.85,25.96-86.78-17.33,3.1-34.66,6.2-51.99,9.3Z"/>
  </g>
  
  <g id="_躯干" data-name="躯干">
    <rect id="_腰" data-name="腰" fill="#1d2024" x="422.69" y="607.7" width="53.91" height="18.99"/>
    <path id="_跨" data-name="跨" fill="#26292e" d="M413.66,619.25h68.91c3.6,5.54,7.21,11.07,10.81,16.61-3.6,6.65-7.21,13.3-10.81,19.95h-68.91v-36.57Z"/>
    <path id="_胸" data-name="胸" fill="#2e3238" d="M408.41,613.15h87.44c18.17-11.81,36.35-23.61,54.52-35.42,3.2-16,6.4-31.99,9.6-47.99-41.52-5.4-83.04-10.8-124.56-16.2-22.26-8.45-44.52-16.89-66.78-25.34l-39.09,33.67c3.74,10.41,7.48,20.83,11.23,31.24,13.4,6.38,26.81,12.76,40.21,19.13,9.14,13.63,18.29,27.27,27.43,40.9Z"/>
