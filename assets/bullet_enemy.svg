<svg xmlns="http://www.w3.org/2000/svg" width="18" height="9" viewBox="0 0 18 9">
  <!-- 敌弹：锈红水滴（彗星形），与玩家弹同一形状语言、更钝更重。
       定位：敌方压制性流弹，不是弹幕游戏那种"躲我"红点 ——
       所以不再用圆点，画成正常的枪弹形，红只是阵营涂装（非警报色用法）。
       比例账：比玩家弹慢(1040 vs 2400)、更钝：弹长 17、弹头圆 ø9、
       长宽比 1.9:1（玩家弹 2.6:1）—— 又重又慢的重弹头。
       姿态：+X = 飞行方向，圆头在右。引擎按合速度旋转整颗（bullet.gd _refresh）。
       用色（出处）：
         弹体 #ff5140 = 敌方阵营点缀色（enemy_walker/drone/shield/boss 全系同源，
                        亦即 enemy.gd IMPACT_TINT 的命中迸溅色，弹与溅同色）
         弹芯 #ffdcc8 / 鼻尖 #ffeee2 = 白热芯（muzzle_flash 白热色族压红调） -->
  <!-- 形状账（关于中线 y=4.5 上下对称）：
       鼻尖 (17,4.5)，弹头圆 r4.5 圆心 (12.5,4.5) —— 鼻尖切线竖直，圆头；
       肩点 (12,0)/(12,9)，肩部切线水平，无折角；
       尾尖 (0.7,4.5)，有意的水滴尖角。
       凹凸同玩家弹：肩后 (6.5,0) 水平强拉 + (2.6,2.4) 收尖 = 彗星尾内凹。 -->
  <path d="M 17,4.5
           C 17,1.55 15.5,0 12,0
           C 7.2,0 3.2,2.5 0.7,4.5
           C 3.2,6.5 7.2,9 12,9
           C 15.5,9 17,7.45 17,4.5 Z"
        fill="#ff5140"/>
  <!-- 白热芯：只让弹头发热（椭圆 x 9~16.2 / y 2.2~6.8，占弹长 1/3）。
       （第一版芯过大盖过弹体，红水滴读成粉白团，已收小。） -->
  <ellipse cx="12.6" cy="4.5" rx="3.6" ry="2.3" fill="#ffdcc8"/>
  <circle cx="15.4" cy="4.5" r="1.3" fill="#ffeee2"/>
</svg>
