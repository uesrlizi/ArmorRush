<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- 触控按钮图标·斩击 v3（用户：新月版丑，画把剑；全组转纯白无彩色）：
     竖直宽刃直剑，尖朝上。三图标（剑/子弹/推进）统一竖直构图+无彩色，
     层次规则=主体主白 #eae6d1、次级/动势暗白 #b0ac9e。
     画布 240×240，引擎内显示 120×120（同族档）。
     用色（无彩色，全组统一三档，出自 UI 白系）：
       主白 #eae6d1 = HUD 原文字/按钮色 Color(0.92,0.9,0.82)（现役，禁改）；
       暗白 #b0ac9e / 亮白 #ffffff = 主白明度两档（无彩色灰阶）。
     比例账（全长 177，画布中轴 x=120）：
       剑身宽 28（x106..134），尖 y34 收角 30 高到 y64，肩 y152——宽:全长 1:6.3
         短粗档（对齐机甲 chunky 语言，不取细长西洋剑 1:8）；
       护手横条厚 18（y151..169，上缘 y151 与剑身同色重叠 1px 防 AA 缝）、
         宽 80（x80..160），端头上下各切 5（AC 切角语言）；
       柄宽 16（x112..128）长 30（y169..199，暗白=次级档）；柄尾压块宽 32（x104..136）
         厚 12（y199..211）。
       剑身:护手宽 = 28:80，护手出肩 26 一侧（经典剑比例，护手不出头就不读剑）。
     坐标账：全直边多边形/矩形（ThorVG 零风险）；整组 bbox (80..160, 34..211)
       居中（上 34/下 29/左 80/右 80）。 -->
  <path d="M 120,34 L 134,64 L 134,152 L 106,152 L 106,64 Z" fill="#eae6d1"/>
  <polygon points="85,151 155,151 160,156 160,164 155,169 85,169 80,164 80,156" fill="#eae6d1"/>
  <rect x="112" y="169" width="16" height="30" fill="#b0ac9e"/>
  <rect x="104" y="199" width="32" height="12" fill="#eae6d1"/>
</svg>
