<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- 触控按钮图标·上升推进 v3（跳跃键，读法=背部喷火/上升，不画"跳跃"）：
     上方双上向山形箭头 + 下方三道八字下喷线（焰推下=体升上，物理读法）。
     v3 改动（用户：全组转纯白无彩色）：箭头不动；v2 的灰阶焰锥读不出"焰"，
     换三道向外八字展开的下喷短线——与子弹拖尾线同一速度线语言；
     层次规则全组统一：主体（箭头）主白，动势/次级（喷线）暗白。
     画布 240×240，引擎内显示 120×120（按钮 radius=100 圆内居中，import svg/scale=1.0
     → 2px/单位 像素密度，手机 2x DPI 内不发虚）。
     用色（无彩色两档，全组统一）：
       主白 #eae6d1 = HUD 原文字/按钮色 Color(0.92,0.9,0.82)（现役，禁改）；
       暗白 #b0ac9e = 主白降明度档（喷线/拖尾线/柄通用）。
     比例账（单位 px，240 画布）：
       山形箭头 ×2 同宽：跨 92（x74..166），拱高 38（顶-臂端 y 差），笔画厚 20；
         两中心线间距恒 44（顶点 y40/y84，臂端 y78/y122 同差），带间净空 = 44-20 = 24，
         全程等距，读作紧凑等宽双箭头。
       下喷线 ×3：根部聚拢（中轴±8）尾部发散（中轴±24），中道最长（y146→196），
         侧道（y146→180，stroke 11、中道 13）——聚拢发散=喷流形态，防读成平行线组；
         线顶 y146 与箭头带底 132 间净空 14。
       全图纵向 y30..202（含圆帽）居中（上 30/下 38）。
     坐标账：箭头为折线描边（stroke 20，miter 尖）；喷线圆帽。 -->
  <g stroke="#eae6d1" stroke-width="20" fill="none">
    <path d="M 74,78 L 120,40 L 166,78"/>
    <path d="M 74,122 L 120,84 L 166,122"/>
  </g>
  <g stroke="#b0ac9e" stroke-linecap="round" fill="none">
    <path d="M 120,146 L 120,196" stroke-width="13"/>
    <path d="M 112,146 L 96,180" stroke-width="11"/>
    <path d="M 128,146 L 144,180" stroke-width="11"/>
  </g>
</svg>
