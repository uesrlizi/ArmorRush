<svg xmlns="http://www.w3.org/2000/svg" width="26" height="6" viewBox="0 0 26 6">
  <!-- 通用弹（敌我共用一颗，用户要看无区分效果）：亮黄细长水滴，纯色平涂。
       比例账：弹长 25、弹头圆 ø6，长宽比 4.2:1（第二代：8 高水滴被拉细长）。
       姿态：+X = 飞行方向，圆头在右。引擎按合速度旋转整颗（bullet.gd _refresh）。
       用色：#ffee58 = 初代玩家弹的原亮黄（用户点名改回）。纯色，无白热芯
       （用户：纯色就够了；第一代双色弹芯方案见 assets/bullet_enemy.svg 存档）。
       敌弹 scene（enemy_bullet.tscn）直接引用本文件，不另存副本。
       2026-10-19 三轮对比度实验全部否决回退（描边/压深芯/光晕均被否，
       用户："不要光晕，子弹改回去"）——三章的可读性由压暗天光承担
       （暮色暴风雪档，见 art_proposals/snowfield_ch3/bake_snow_assets.py 天光账），
       本资产维持原样不再动。 -->
  <!-- 形状账（关于中线 y=3 上下对称）：
       鼻尖 (25,3)，弹头圆 r3 圆心 (22,3) —— 鼻尖处切线竖直，成圆头；
       肩点 (21,0)/(21,6)，肩部切线水平（前后控制点同 y），无折角；
       尾尖 (0.8,3)，有意的水滴尖角。
       凹凸：肩后控制点 (14,0) 水平强拉 7px 再以 (4.5,1.8) 浅角收向尾尖——
       彗星尾内凹、细长收尖；尾尖入射斜率 0.32（第一代 0.68，这代刻意更浅更细）。 -->
  <path d="M 25,3
           C 25,1.05 23.55,0 21,0
           C 14,0 4.5,1.8 0.8,3
           C 4.5,4.2 14,6 21,6
           C 23.55,6 25,4.95 25,3 Z"
        fill="#ffee58"/>
</svg>
