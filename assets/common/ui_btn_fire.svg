<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- 触控按钮图标·射击 v3（用户：画枪或一颗子弹，倾向纯白无彩色；取子弹——
     更小更清楚，且与游戏弹体语言同源）。经典子弹侧影（尖弹头+弹壳+底缘）
     斜 45° 朝右上 + 尾部两道错开拖尾线（一长一短，速度线语言）。
     画布 240×240，引擎内显示 120×120（同族档）。无彩色三档同 ui_btn_melee.svg：
     主体（弹头/底缘）主白，次级（弹壳/拖尾线）暗白。
     变换账（rotate 已烘焙——实验定谳 ThorVG 对 g rotate 静默输出全透明，
     任何旋转变换必须烘焙进坐标）：
       直轴形绕 (120,120) 顺时针 45°（尖朝右上）：
         x' = 120 + 0.7071·(x−y)，y' = 120 + 0.7071·(x+y−240)
       直轴形（中轴 x=120）：弹头从壳口宽 36（x102..138）y105 收窄到 (110/130,66)，
         顶圆 r10 圆心 (120,66)（顶 y56，尖弹头防"蜡笔"读法）；
         弹壳宽 52（x94..146）y105..188；底缘宽 64（x88..152）y188..200；
         拖尾线 ×2 竖直 (110,206)→(110,230) 长 / (132,202)→(132,216) 短。
       关键旋转锚点：弧顶 (120,56)→(165.3,74.7)，弹头根 (102,105)→(117.9,96.7)，
         弹壳底角 (146,188)→(90.3,186.5)，底缘外角 (88,188)→(49.3,145.5)。
     比例账：弹全长 144（56..200）:弹头宽 36 = 4:1；弹头/弹壳/底缘宽 36/52/64
         三级台阶（经典子弹侧影读法）；拖尾线沿弹轴方向一长一短。
     布局账：形状本体 bbox ≈ (41..173, 67..199)，弹主体轴心即画布中心（旋转不动心），
         拖尾向左下探出作动势。 -->
