<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 16" width="36" height="16">
<!-- 钢嵴排炮重弹（熔渣重弹）36x16，原点(18,8)，+X=弹头（引擎 rotation 沿速度方向转整弹）。
slag_slug.tscn=bullet.gd 纯换皮（普攻单发慢速大弹，速度/伤害 BARGE_SLUG_*）。
造型账：钝头滴形熔渣团——尾 x3 → 鼻 x34，最宽 ±6 @x22；比敌共用水滴弹（24x6
压 0.7）大一号半，弹速 500 下眼睛凝视得住，读成「重弹」而非「弹流」。
层序：外缘暗熔 #b4451f（亮/暗底都靠它剪影）→ 熔橙 #ff8c42 → 高温黄 #ffb35a 芯
（x14..30，鼻端最热）；尾半段两块浮焦壳 #3a2a1c 破型（slag_pool 同语汇：熔渣=
有壳的液体，不是光弹）。色板=精炼所熔渣族（mortar_shell/slag_pool 同族，无新色）。
碰撞=胶囊沿 +X，r5×长26（贴合滴形主干 x5..31；在 tscn 里转 90°）。 -->
<polygon points="3,8 10,3.5 22,2 30,3 34,6.5 34,9.5 30,13 22,14 10,12.5" fill="#b4451f"/>
<polygon points="6,8 12,5 22,4 29,4.8 32,7 32,9 29,11.2 22,12 12,11" fill="#ff8c42"/>
<polygon points="14,8 20,6 27,6.3 30,8 27,9.7 20,10" fill="#ffb35a"/>
<polygon points="8,6 13,5 15,7.5 10,8.5" fill="#3a2a1c" opacity="0.85"/>
<polygon points="9,10.5 14,9.5 16,11.5 11,12" fill="#3a2a1c" opacity="0.75"/>
</svg>
