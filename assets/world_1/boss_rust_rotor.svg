<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 22" width="320" height="22">
<!-- BOSS 主旋翼（独件，绕画布中心 pivot 旋转=侧视旋翼盘的刃边）。
     侧视语义：旋翼盘正对第三轴→投影为横刃条，不画椭圆盘面。
     桨叶 304 长条 #282322 + 上方 0.32 透明模糊带（转速感），
     中央变距握持 #171514 对准桅顶（局部 x -28..-8 = 桅 122..142）。
     pivot=画布中心(160,11)，引擎里只做 ±~2° 呼吸摆动，不做整周旋转。 -->
  <rect x="44" y="3" width="232" height="4" fill="#282322" opacity="0.32"/>
  <rect x="8" y="8" width="304" height="7" fill="#282322"/>
  <rect x="150" y="2" width="20" height="16" fill="#171514"/>
</svg>
