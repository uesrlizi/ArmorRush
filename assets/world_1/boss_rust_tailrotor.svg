<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
<!-- BOSS 尾旋翼（独件，绕画布中心整周旋转）。
     侧视语义：尾桨盘平行屏幕→正圆三叶，旋转在 2D 成立。
     桨叶用受光 #453d39（暗对暗会隐形），毂 #282322+深芯 #171514，
     三叶 120° 手工预算坐标（绕 28,28）。 -->
  <polygon points="25,23 31,23 29,4 27,4" fill="#453d39"/>
  <polygon points="33.8,27.9 30.8,33.1 48.3,40.9 49.3,39.1" fill="#453d39"/>
  <polygon points="25.2,33.1 22.2,27.9 6.7,39.1 7.7,40.9" fill="#453d39"/>
  <circle cx="28" cy="28" r="6.5" fill="#282322"/>
  <circle cx="28" cy="28" r="2.5" fill="#171514"/>
</svg>
