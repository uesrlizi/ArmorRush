<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="60" height="80">
<!-- 精英·导弹车 整体构图（车体+肩部垂发舱一体，原生朝左，地面 y=80）。
     舱体读写：挂 ArmPivot(14,-38.5)=舱口正中，Muzzle(0,0)，两仓口列 pivot x=±5.5
     （canvas 38.5/49.5-44），一轮齐射 2 发=两仓口 1:1（elite_mortar.gd CELL_MUZZLE_X）。
     比例账（功能反推）：飞行弹径 5.6（8×0.7 缩）→ 仓口宽 9 ×2 仓 + 舱壁 2 → 舱宽 24；
     仓深≈23（≥2×弹径）→ 舱全高 34，与车体 hull（30 高）等量级=肩部武装主导剪影；
     头 16×14 前置远小于舱（舱顶高出头 20px）——"头"由眼缝指认，舱不抢头位。
     全高 80 = 杂兵 52 的 1.54 档、玩家 104 的 0.77 档（精英=矮壮重甲）。
     视角：纯侧视，仓口=顶缘平齐深缝，无朝向镜头的管口/截面。
     色板（平涂无描边）：#332e2c 主 / #282322 暗 / #453d39 亮 / #171514 最暗 / #ff5140 红。 -->
<!-- 天线（头后掠出一根） -->
<line x1="26" y1="20" x2="29" y2="12" stroke="#171514" stroke-width="1.5"/>
<!-- 远侧腿+远侧脚（整体暗一档，藏车身后） -->
<polygon points="42,58 54,60 56,74 52,80 44,80 42,68" fill="#282322"/>
<polygon points="40,80 60,80 60,76 46,76" fill="#171514"/>
<!-- 胯部暗块（hull 与近侧腿之间的关节缝） -->
<rect x="20" y="62" width="24" height="10" fill="#171514"/>
<!-- 车体 hull：前鼻尖收锋，顶甲载舱（甲板延到舱尾正下方），尾墙下收 -->
<polygon points="0,50 10,34 56,34 58,40 58,58 52,64 8,64" fill="#332e2c"/>
<!-- 前斜面受光窄条 -->
<polygon points="10,34 12,34 2,50 0,50" fill="#453d39" opacity="0.4"/>
<!-- 尾侧散热栅两道 -->
<rect x="44" y="44" width="8" height="1.25" fill="#282322" opacity="0.8"/>
<rect x="44" y="47" width="8" height="1.25" fill="#282322" opacity="0.8"/>
<!-- 近侧腿：大腿/小腿/亮色踏地足板 -->
<polygon points="34,66 16,68 20,76 34,74" fill="#332e2c"/>
<polygon points="20,74 16,78 18,80 38,80 36,76" fill="#282322"/>
<polygon points="12,80 42,80 42,76 18,76" fill="#453d39"/>
<!-- 头：前顶小方头，前下角内收，红色传感器眼缝（发光由场景 EyeGlow 叠） -->
<polygon points="12,20 28,20 28,34 14,34 12,30" fill="#453d39"/>
<rect x="15" y="25" width="8" height="3" fill="#ff5140"/>
<!-- 肩部垂发舱（后置背包，两仓）：舱体（底部 2px 斜削） -->
<polygon points="32,3 56,3 56,24 54,26 34,26 32,24" fill="#332e2c"/>
<!-- 仓间壁在舱面的延伸缝 -->
<rect x="43.5" y="3" width="1" height="21" fill="#282322" opacity="0.8"/>
<!-- 裙座 -->
<rect x="33" y="26" width="22" height="8" fill="#282322"/>
<!-- 敌方红识别条 -->
<rect x="36" y="29" width="8" height="2" fill="#ff5140" opacity="0.85"/>
<!-- 舱尾散热栅两道 -->
<rect x="47" y="28.5" width="6" height="1.25" fill="#171514" opacity="0.8"/>
<rect x="47" y="31.5" width="6" height="1.25" fill="#171514" opacity="0.8"/>
<!-- 顶缘舱壁（三段亮色） -->
<rect x="32" y="0" width="2" height="3" fill="#453d39"/>
<rect x="43" y="0" width="2" height="3" fill="#453d39"/>
<rect x="54" y="0" width="2" height="3" fill="#453d39"/>
<!-- 两列仓口：平齐深缝（Muzzle 轮转 ±5.5 就位于此） -->
<rect x="34" y="0" width="9" height="3" fill="#171514"/>
<rect x="45" y="0" width="9" height="3" fill="#171514"/>
</svg>
