<radialGradient id="rg2"><stop offset="0" stop-color="#fff8e8" stop-opacity="0.95"/><stop offset="1" stop-color="#fff8e8" stop-opacity="0.0"/></radialGradient>
</defs>
<ellipse cx="16" cy="16" rx="15" ry="15" fill="url(#rg1)"/>
<ellipse cx="16" cy="16" rx="7" ry="7" fill="url(#rg2)"/>
