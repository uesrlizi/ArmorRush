<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 12" width="30" height="12">
<!-- 断云机鼻曳光矢弹 30x12（+X=飞行方向）。v2 重画：紫白波浪带被否。
     语汇=啸雷弹同族"白热带+暗壳"双读法截击曳光矢：前 1/3 暗紫壳针尖
     （金霞地平带上靠暗壳读），后 2/3 白金曳光带（暗紫天上靠亮带读），
     尾部开口=曳光燃烧口。dawn_bolt.tscn=bullet.gd 纯换皮，胶囊规格不变。
     坐标账：画布 30x12，弹尖 (29,6)，壳体 y3.6..8.4 后收 x2；曳光带
     x2..18 覆盖后段，白热芯内嵌。四周留 ≥1.5px 防采样切边。 -->
<polygon points="29,6 14,3.6 2,4.2 2,7.8 14,8.4" fill="#3a2c50"/>
<polygon points="26.5,6 14,4.6 4,5 4,7 14,7.4" fill="#5a4470"/>
<polygon points="2,4.4 13,4.9 18,5.3 18,6.7 13,7.1 2,7.6" fill="#ffd9a0"/>
<polygon points="2,5.3 17,5.5 17,6.5 2,6.7" fill="#fff8e8"/>
</svg>
